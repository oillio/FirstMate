name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Requirement IDs, ADRs, command guard
        run: python tools/check_docs.py
      - name: Unit tests for repository tools
        run: python -m unittest discover -s tests -v
